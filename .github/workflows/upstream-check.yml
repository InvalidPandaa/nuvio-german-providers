name: Upstream GermanProviders sync

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upstream-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Bnyro/GermanProviders.git
          git fetch --no-tags upstream master
      - name: Detect and document upstream changes
        id: report
        run: node scripts/upstream-report.js
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- UPSTREAM_UPDATE.md .upstream.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for existing upstream PR
        if: steps.changes.outputs.changed == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh pr list --repo "${{ github.repository }}" --head "automation/upstream-sync" --state open --json number --jq 'length')"
          echo "exists=$count" >> "$GITHUB_OUTPUT"
      - name: Create automation branch
        if: steps.changes.outputs.changed == 'true' && steps.existing.outputs.exists == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/upstream-sync
          git add UPSTREAM_UPDATE.md .upstream.json
          git commit -m "chore: document upstream GermanProviders changes"
          git push --set-upstream origin automation/upstream-sync --force
      - name: Create draft pull request
        if: steps.changes.outputs.changed == 'true' && steps.existing.outputs.exists == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --repo "${{ github.repository }}" \
            --head automation/upstream-sync \
            --base main \
            --draft \
            --title "chore: upstream GermanProviders update" \
            --body-file UPSTREAM_UPDATE.md
