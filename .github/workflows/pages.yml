name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - src/**
      - shared/**
      - providers/**
      - manifest.json
      - build.js
      - package*.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish; only the newest waiting one is kept
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # rebuild from src/ so Pages never serves stale bundles
      - run: npm run build
      - run: npm test
      - name: Collect site
        run: |
          mkdir _site
          cp -r manifest.json providers _site/
      - uses: actions/upload-pages-artifact@v4
      - id: deployment
        uses: actions/deploy-pages@v4
